    "RUSTSEC-2026-0441",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    "RUSTSEC-2025-0141",
]
